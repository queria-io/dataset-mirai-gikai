$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: AIインタビュー
description: |-
  みらい議会のAIインタビューで、回答者が公開に同意した回答です。1 行が 1 件のインタビューで、回答者の立場・賛否と要約を持ちます。チームみらいが氏名・住所・連絡先など個人を識別できる情報を除いて公開しています。

  回答者やその関係者を識別・推測すること、そのために他の情報と照合することは、利用規約で禁止されています。
primary_key: [report_id]
sources: [interviews]
columns:
  - name: report_id
    title: インタビュー ID
  - name: bill_id
    title: 法案 ID
    description: bills.bills の bill_id と結合できる
  - name: bill_name
    title: 法案名
  - name: stance
    title: 賛否
    description: for（賛成）・against（反対）・neutral（中立）
    dimension: categorical
  - name: role
    title: 立場
    description: general_citizen（一般市民）・daily_life_affected（生活に影響を受ける）・work_related（仕事で関わる）・subject_expert（専門家）など
    dimension: categorical
  - name: role_title
    title: 立場（表示名）
  - name: role_description
    title: 立場の説明
    description: インタビューの内容から作った、回答者の立場の説明
  - name: summary
    title: 要約
  - name: created_at
    title: 作成日時
