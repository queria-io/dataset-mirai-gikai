name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 公開の対象から外れたインタビューを早く消すため、毎日 05:00 JST にすべて取得し直す
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@03f0facbec0d7795c3b95cbcacedc1d26e500591
    with:
      dataset_name: mirai_gikai
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
