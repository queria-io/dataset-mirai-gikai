name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 公開の対象から外れたインタビューを早く消すため、毎日 05:00 JST にすべて取得し直す
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: mirai_gikai
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
