name: "mirai_gikai"
version: "1.0.0"

profile: "mirai_gikai"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  mirai_gikai:
    +database: mirai_gikai
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    interviews:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
    bills:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
