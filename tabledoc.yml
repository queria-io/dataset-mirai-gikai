$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: mirai_gikai
title: みらい議会
description: |-
  チームみらいが運営する「みらい議会」のオープンデータ API から取得したデータです。国会の法案の一覧（bills.bills）と、法案についてのAIインタビューの回答（interviews.reports・interviews.opinions・interviews.messages）のテーブルがあります。毎日、すべてを取得し直します。

  法案は法案名で shugiin.bills.bills の議案の件名と結合でき、そこから法令番号で e_gov.laws の法令と、審議した国会・委員会で kokkai.minutes.meetings の会議録と結合できます。法案のテーブルは法案を特定する項目と審議の状況だけを持ち、みらい議会の解説の文章は持ちません。

  AIインタビューは、回答者が公開に同意した回答から、チームみらいが個人を識別できる情報を除いて公開しているものです。回答者やその関係者を識別・推測すること、そのために他の情報と照合することは利用規約で禁止されています。公開の対象から外れた回答は、次の取得で消えます。

  出典：
  - データ出典：「みらい議会AIインタビュー（チームみらい）」
  - データ提供元URL：https://gikai.team-mir.ai/
  - 本規約のURL：https://gikai.team-mir.ai/developers/interview-data-terms
  - ライセンス：CC BY 4.0
image: cover.png
